project: center_surround
entity: walkerlab
program: /src/project/model_simulation.py
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
method: grid
metric:
  name: sum_diffs
  goal: maximize
parameters:
  gabor_filters_fname:
    values: ["/src/project/computed/center_masked_surround_gabors.npy"]
  stimuli_fname:
    values: ["/src/project/computed/center_masked_surround_stimuli.npy"]
  global_orientation_lower_bound:
    values: [0]
  global_orientation_upper_bound:
    values: [180]
  rate_code_signature:
    values: ["inv_(base+vonmises)"]
  baseline_firing_rate: 
    values: [1000, 500, 100, 50, 10, 5, 1, 0.5, 0.1, 0.05, 0.01, 0.05, 0.001]
  vonmises_loc:
    values: [0]
  vonmises_kappa:
    values: [0.1, 1, 2, 3, 4, 5, 10, 20, 50]
  stimulus_std:
    values: [1, 0.1, 0.01]
  prior_sampling_draws:
    values: [10]
  posterior_sampling_draws:
    values: [1000]
  posterior_sampling_tunes:
    values: [1000]
  posterior_sampling_chains:
    values: [4]
  posterior_sampling_cores:
    values: [4]
  posterior_sampling_tries:
    values: [2]
  random_seed:
    values: [42]